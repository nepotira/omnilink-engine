<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="omniBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#omniBg)" stroke="#38bdf8" stroke-width="2.2" stroke-opacity="0.7"/>

  <!-- Workstation / Display Frame -->
  <rect x="22" y="26" width="60" height="42" rx="6" fill="#1e293b" stroke="url(#cyanGrad)" stroke-width="3" opacity="0.9"/>
  <!-- Workstation Stand -->
  <path d="M 46 68 L 42 78 L 62 78 L 58 68 Z" fill="#38bdf8" opacity="0.8"/>
  <rect x="36" y="78" width="32" height="4" rx="2" fill="#38bdf8" opacity="0.8"/>

  <!-- Smartphone Frame (Docked Overlapping) -->
  <rect x="66" y="44" width="40" height="62" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="3.2" filter="url(#glow)"/>
  <rect x="71" y="52" width="30" height="46" rx="4" fill="#1e1b4b"/>
  <circle cx="86" cy="48" r="1.8" fill="#f59e0b"/>

  <!-- High-Speed Interconnect Bridge -->
  <path d="M 52 47 C 62 47 62 60 72 60" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 3" filter="url(#glow)"/>
  <circle cx="52" cy="47" r="3.5" fill="#38bdf8"/>
  <circle cx="72" cy="60" r="3.5" fill="#f59e0b"/>

  <!-- Lightning Bolt (Zero Latency Core) -->
  <polygon points="86,64 78,76 84,76 82,88 92,74 85,74" fill="url(#coreGrad)" filter="url(#glow)"/>
</svg>
