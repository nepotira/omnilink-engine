<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c2b"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#3a7bd5" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Phone Outline -->
  <rect x="36" y="24" width="56" height="80" rx="10" fill="none" stroke="url(#primaryGrad)" stroke-width="3" opacity="0.4"/>
  <circle cx="64" cy="30" r="2" fill="#00d2ff" opacity="0.6"/>

  <!-- Gamepad Silhouette -->
  <path d="M 40 48 C 30 48 24 58 24 72 C 24 86 32 94 42 94 C 48 94 54 88 58 82 L 70 82 C 74 88 80 94 86 94 C 96 94 104 86 104 72 C 104 58 98 48 88 48 C 76 48 70 54 64 54 C 58 54 52 48 40 48 Z" 
        fill="#1e2438" stroke="url(#primaryGrad)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- D-Pad -->
  <path d="M 40 60 L 40 66 L 34 66 L 34 72 L 40 72 L 40 78 L 46 78 L 46 72 L 52 72 L 52 66 L 46 66 L 46 60 Z" fill="#00d2ff" opacity="0.85"/>

  <!-- ABXY Buttons -->
  <circle cx="84" cy="63" r="3" fill="#ff4b4b"/>
  <circle cx="91" cy="69" r="3" fill="#ffe600"/>
  <circle cx="77" cy="69" r="3" fill="#00e676"/>
  <circle cx="84" cy="76" r="3" fill="#2979ff"/>

  <!-- Turbo POCO Lightning Bolt -->
  <polygon points="65,34 55,54 63,54 61,72 73,50 64,50" fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>
